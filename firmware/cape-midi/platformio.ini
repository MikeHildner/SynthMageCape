; Synth Mage cape, MIDI firmware (phase 2).
; Developed on a spare ESP32-S3 (N16R8), flashed through its UART socket.
; Run PlatformIO through tools/pio.cmd (see firmware/README.md for why):
;   Build:   tools\pio run
;   Flash:   tools\pio run -t upload
;   Monitor: tools\pio device monitor

[env:spare-s3]
; Pinned: platform 8.0.0 brings Arduino-ESP32 core 3.3.x and GCC 14.2.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
