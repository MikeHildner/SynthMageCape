; Synth Mage cape, MIDI firmware (phase 2).
; For the cape's own ESP32-S3 (N16R8); the spare boards are identical.
; Run PlatformIO through tools/pio.cmd (see firmware/README.md for why):
;   Build:            tools\pio run
;   Flash over USB:   tools\pio run -t upload      (COM socket; lapels unplugged)
;   Flash over Wi-Fi: tools\ota                    (cape powered, at home)
;   Monitor:          tools\pio device monitor

[env:cape]
; Pinned: platform 8.0.0 brings Arduino-ESP32 core 3.3.x and GCC 14.2.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Writes include/BuildStamp.h with the build time before each build.
extra_scripts = pre:stamp.py

; Bluetooth: NimBLE is the lighter of the two ESP32 Bluetooth stacks.
; LEDs: FastLED.
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    fastled/FastLED@3.10.9
