# Version catalog: the one place where every plugin and library version is written down.
# Build files refer to these entries as libs.xxx, so a version is never repeated.

[versions]
# Android Gradle plugin. 9.x compiles Kotlin itself ("built-in Kotlin"), so there is
# no separate kotlin-android plugin in this project.
agp = "9.0.0"
# Used only for the Compose compiler plugin; must match the Kotlin version AGP 9.0 uses.
kotlin = "2.2.10"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
# The Compose BOM ("bill of materials") picks a set of Compose library versions that
# are tested together, so the individual Compose libraries below carry no version.
composeBom = "2025.09.01"
junit = "4.13.2"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom ={ group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
